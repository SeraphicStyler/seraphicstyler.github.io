<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Catalog quality · Seraphic Styler</title>
<style>:root{color-scheme:light dark;--paper:#eef3fb;--surface:#fff;--ink:#233a72;--line:#c9cfe0}@media(prefers-color-scheme:dark){:root{--paper:#1a1d29;--surface:#242837;--ink:#eef2fb;--line:#596179}}*{box-sizing:border-box}body{font:16px/1.6 system-ui;background:var(--paper);color:var(--ink);max-width:1100px;padding:24px;margin:auto}a{color:inherit;min-height:44px;display:inline-flex;align-items:center}h1{font-weight:500}#metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}article{padding:20px;border:1px solid var(--line);background:var(--surface);border-radius:14px}strong{font-size:28px;display:block}summary{cursor:pointer;min-height:48px}li{padding:8px 0;overflow-wrap:anywhere}:focus-visible{outline:3px solid currentColor;outline-offset:3px}</style>
<a href="../fashion-directory">← Directory</a><h1>Catalog review</h1><p>Evidence gaps in the imported directory. These counts describe recorded data, not a fresh assessment of the businesses.</p><p><a href="catalog-brands.json">Normalized snapshot</a> · <a href="catalog-quality.json">Quality report</a></p><div id="metrics"></div><details open><summary>Shared handles to review</summary><ul id="collisions"></ul></details><details><summary>Records needing normalization or confirmation</summary><ul id="queue"></ul></details><noscript><p>Open the JSON reports above for the complete data.</p></noscript>
<script src="../js/directory-data.js"></script><script src="../js/directory-catalog.js"></script><script src="../js/store-coords.js"></script><script>
const c=SS_CATALOG_CORE.create(SS_DIRECTORY,SS_COORDS),q=c.quality();const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;};
for(const [label,k,den]of [['House records','brands',null],['Location observations','locations',null],['Exact entrance geocodes','exact_geocodes',q.locations],['Street-level geocodes','street_geocodes',q.locations],['Structured weekly hours','structured_hours',q.locations],['Dated verification in last 90 days','verified_last_90_days',q.brands],['Missing location coordinates','missing_geocode',q.locations],['Location district unresolved','missing_district',q.locations]]){const a=node('article',label);a.append(node('strong',q[k]+(den?' / '+den:'')));if(den)a.append(node('span',Math.round(q[k]/den*100)+'%'));document.getElementById('metrics').append(a);}
for(const x of q.alias_collisions)document.getElementById('collisions').append(node('li',x.alias+' — '+x.brand_ids.map(id=>c.get(id).display_name).join(', ')));
for(const x of q.review_queue){const li=node('li',''),a=node('a',c.get(x.id).display_name);a.href='../fashion-directory?view=record&brand='+encodeURIComponent(x.id);li.append(a,node('span',' · '+x.issues.join(', ')));document.getElementById('queue').append(li);}
</script></html>
