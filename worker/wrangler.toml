# Renamed from "seraphic-api" on 8 Aug 2026. A Worker is identified by name
# within an account, so sharing that name with ~/code/seraphic-api meant each
# `wrangler deploy` REPLACED the other project's script — and because the name
# also owns the api.seraphicstyler.com custom domain, this fetcher ended up
# answering the directory API's hostname and 404ing every /v1/ path.
name = "seraphic-product-meta"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

# Cache for extracted product metadata. Create it with:
#   npx wrangler kv namespace create CACHE_KV
# then paste the printed id below. The Worker runs without it — KV only
# saves repeat fetches, it is not required for correctness.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "7cabb80064cd4105aba4e3bb80eca5e6"

# Once the Worker is deployed and working on *.workers.dev, expose it on the
# real domain. DNS for seraphicstyler.com is already on Cloudflare, so this
# needs no nameserver change.
# [[routes]]
# pattern = "api.seraphicstyler.com/api/*"
# custom_domain = true
