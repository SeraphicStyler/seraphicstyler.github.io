<svg viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seraphic Styler fine-line butterfly mark">
  <!-- Refined symmetric butterfly — hairline cobalt outline, whisper of gossamer fill.
       Recolour via stroke (default #2e54ad); set stroke="currentColor" to inherit. -->
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb8e6"/>
      <stop offset="1" stop-color="#f1bcd3"/>
    </linearGradient>
  </defs>
  <g stroke="#2e54ad" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"
     fill="url(#gw)" fill-opacity="0.14">
    <g id="bw">
      <!-- upper wing -->
      <path d="M32 22 C40 8 56 6 58 16 C59.4 23 47 27 33 26 Z"/>
      <!-- lower wing -->
      <path d="M33 27 C44 28 53 32 52 39 C51.4 43.6 44 44 39 40 C35 36.8 33 31 33 28 Z"/>
      <!-- gossamer veins -->
      <path d="M34 24 C42 17 50 13 56 13" fill="none" stroke-width="0.35" stroke-opacity="0.55"/>
      <path d="M34 30 C40 33 45 37 49 41" fill="none" stroke-width="0.35" stroke-opacity="0.55"/>
    </g>
    <use href="#bw" transform="translate(64,0) scale(-1,1)"/>
  </g>
  <g stroke="#2e54ad" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- slim body -->
    <path d="M32 19 C30.7 23 30.7 31 32 35 C33.3 31 33.3 23 32 19 Z" fill="#2e54ad" fill-opacity="0.16" stroke-width="0.5"/>
    <!-- antennae -->
    <path d="M32 19.5 C30 15 27 13 24.6 12" stroke-width="0.7"/>
    <path d="M32 19.5 C34 15 37 13 39.4 12" stroke-width="0.7"/>
  </g>
  <circle cx="24.6" cy="12" r="0.9" fill="#2e54ad"/>
  <circle cx="39.4" cy="12" r="0.9" fill="#2e54ad"/>
</svg>
