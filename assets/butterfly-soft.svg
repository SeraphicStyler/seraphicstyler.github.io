<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Seraphic Styler soft butterfly">
  <!-- Soft, symmetric butterfly in the aura language: gossamer gradient wings, white
       hairlines, a glow underlayer, fine cobalt body + antennae, sparkle and motes. -->
  <defs>
    <radialGradient id="bf-halo" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="34%" stop-color="#e2ebfb" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#cdb8e6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#cdb8e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bf-goss" gradientUnits="userSpaceOnUse" x1="80" y1="44" x2="80" y2="120">
      <stop offset="0%" stop-color="#cdb8e6"/>
      <stop offset="50%" stop-color="#e7a6c2"/>
      <stop offset="100%" stop-color="#2e54ad"/>
    </linearGradient>
    <filter id="bf-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="bf-soft" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="1"/></filter>
    <path id="bf-up" d="M80 72 C96 56 118 50 128 50 C138 60 132 76 114 79 C100 81 88 78 80 80 Z"/>
    <path id="bf-lo" d="M80 87 C94 89 108 95 113 107 C117 117 106 120 97 113 C88 107 83 96 80 92 Z"/>
  </defs>

  <rect width="160" height="160" fill="url(#bf-halo)"/>

  <!-- blurred glow underlayer -->
  <g filter="url(#bf-glow)" opacity="0.3">
    <use href="#bf-up" fill="#cdb8e6"/><use href="#bf-up" fill="#cdb8e6" transform="matrix(-1 0 0 1 160 0)"/>
    <use href="#bf-lo" fill="#cdb8e6"/><use href="#bf-lo" fill="#cdb8e6" transform="matrix(-1 0 0 1 160 0)"/>
  </g>

  <!-- gossamer wings -->
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.7" stroke-linejoin="round">
    <use href="#bf-up" fill="url(#bf-goss)" fill-opacity="0.55"/>
    <use href="#bf-up" fill="url(#bf-goss)" fill-opacity="0.55" transform="matrix(-1 0 0 1 160 0)"/>
    <use href="#bf-lo" fill="url(#bf-goss)" fill-opacity="0.5"/>
    <use href="#bf-lo" fill="url(#bf-goss)" fill-opacity="0.5" transform="matrix(-1 0 0 1 160 0)"/>
  </g>

  <!-- soft wing lights -->
  <g fill="#ffffff" fill-opacity="0.6">
    <circle cx="109" cy="64" r="2.2"/><circle cx="51" cy="64" r="2.2"/>
    <circle cx="100" cy="103" r="1.5"/><circle cx="60" cy="103" r="1.5"/>
  </g>

  <!-- body + head -->
  <path d="M80 60 C82 60 84 65 84 77 C84 93 82 104 80 108 C78 104 76 93 76 77 C76 65 78 60 80 60 Z" fill="url(#bf-goss)" fill-opacity="0.85"/>
  <circle cx="80" cy="59" r="3" fill="#2e54ad"/>

  <!-- antennae -->
  <g fill="none" stroke="#2e54ad" stroke-opacity="0.6" stroke-width="0.9" stroke-linecap="round">
    <path d="M80 57 C82 51 86 47 91 44"/><path d="M80 57 C78 51 74 47 69 44"/>
  </g>
  <circle cx="91" cy="44" r="1.3" fill="#2e54ad"/><circle cx="69" cy="44" r="1.3" fill="#2e54ad"/>

  <!-- sparkle + motes -->
  <g filter="url(#bf-soft)"><path d="M128 48 l1.7 4.2 4.2 1.7 -4.2 1.7 -1.7 4.2 -1.7 -4.2 -4.2 -1.7 4.2 -1.7 z" fill="#ffffff"/></g>
  <circle cx="40" cy="50" r="1.6" fill="#cdb8e6" opacity="0.5"/>
  <circle cx="120" cy="118" r="1.8" fill="#f1bcd3" opacity="0.45"/>
  <circle cx="44" cy="116" r="1.3" fill="#ffffff" opacity="0.5"/>
</svg>
