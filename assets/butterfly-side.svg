<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seraphic Styler side-profile butterfly mark">
  <!-- Sleek 3/4 side-profile butterfly. Recolour via the stroke (default brand cobalt #2e54ad);
       swap to #ffffff for dark backgrounds, or set stroke="currentColor" to inherit. -->
  <defs>
    <radialGradient id="wingFade" cx="42%" cy="58%" r="68%">
      <stop offset="0%" stop-color="#2e54ad" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#cdb8e6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2e54ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="#2e54ad" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round">
    <!-- forewing: tall swept, long soft point, gentle S outer edge -->
    <path d="M22.3,27.0 C18.4,18.0 21.6,8.4 31.6,6.6 C38.2,5.4 41.0,11.4 37.8,18.0 C35.0,24.2 28.6,27.4 23.0,28.6 Z" fill="url(#wingFade)"/>
    <!-- hindwing: tapering to a fine tail -->
    <path d="M22.6,29.4 C26.8,31.2 32.2,33.0 35.0,38.0 C36.6,40.8 36.0,43.8 33.6,43.4 C29.6,42.7 25.0,35.6 22.4,30.4 Z" fill="url(#wingFade)"/>
    <!-- forewing vein -->
    <path d="M23.4,27.4 C25.4,21.6 28.2,15.6 31.6,10.8" stroke-width="0.4" stroke-opacity="0.55"/>
    <!-- hindwing vein -->
    <path d="M23.4,30.8 C26.6,33.4 29.8,36.6 32.4,40.6" stroke-width="0.4" stroke-opacity="0.55"/>
    <!-- tiny thin body — shares one clean origin with the antennae and both wings -->
    <path d="M22.3,27.0 C21.5,28.8 21.5,30.6 22.6,32.2"/>
    <!-- antennae, one continuous flowing gesture from the same waist anchor -->
    <path d="M22.3,27.0 C19.9,22.2 17.2,18.4 13.4,16.4"/>
    <path d="M22.3,27.0 C20.6,21.8 18.8,17.2 16.0,13.8"/>
  </g>
  <circle cx="13.4" cy="16.4" r="0.95" fill="#2e54ad"/>
  <circle cx="16.0" cy="13.8" r="0.95" fill="#2e54ad"/>
</svg>
