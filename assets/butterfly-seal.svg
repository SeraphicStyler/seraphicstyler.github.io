<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seraphic Styler celestial butterfly seal">
  <!-- Design C · Celestial seal — butterfly + crescent moon (moon-rabbit nod) in a gradient roundel -->
  <defs>
    <linearGradient id="seal-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1bcd3"/>
      <stop offset="0.5" stop-color="#8aa9cf"/>
      <stop offset="1" stop-color="#2e54ad"/>
    </linearGradient>
    <radialGradient id="seal-glow" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#seal-grad)"/>
  <circle cx="60" cy="60" r="56" fill="url(#seal-glow)"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  <!-- crescent moon cradle (the moon-rabbit nod) -->
  <path d="M86 30 a34 34 0 1 0 8 56 a27 27 0 1 1 -8 -56 z" fill="#ffffff" fill-opacity="0.16"/>
  <!-- white butterfly, centered -->
  <g transform="translate(60 62) scale(0.74) translate(-60 -58)">
    <g fill="#ffffff">
      <path d="M60,57 C66,43 84,29 99,30 C95,32 88,50 74,54 C69,55 64,57 60,57 Z"/>
      <path d="M60,57 C54,43 36,29 21,30 C25,32 32,50 46,54 C51,55 56,57 60,57 Z"/>
      <path d="M60,60 C66,63 80,76 86,86 C82,82 68,82 60,63 Z"/>
      <path d="M60,60 C54,63 40,76 34,86 C38,82 52,82 60,63 Z"/>
      <path d="M60,38 C61.6,40 61.6,47 61.2,56 C60.8,66 60.4,75 60,84 C59.6,75 59.2,66 58.8,56 C58.4,47 58.4,40 60,38 Z"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M59,40 C54,34 50,30 49,25"/>
      <path d="M61,40 C66,34 70,30 71,25"/>
    </g>
  </g>
  <!-- sparkle halo -->
  <path d="M92 36 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8 z" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="30" cy="84" r="2.2" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="86" cy="78" r="1.6" fill="#ffffff" fill-opacity="0.7"/>
</svg>
