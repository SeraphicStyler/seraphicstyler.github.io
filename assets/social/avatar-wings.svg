<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Seraphic Styler social avatar — the Angelic Aura on deep cobalt">
  <!-- ④ Angelic Aura · Profile picture (deep). The same approved brand icon
       (assets/angelic-aura.svg) over deep cobalt, where the gossamer + glow come alive
       and read at the tiniest sizes. Use for dark-mode profiles or grid contrast.
       Export 640×640 PNG (sRGB). The platform crops a centre circle. -->
  <defs>
    <radialGradient id="aw-wash" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="34%" stop-color="#cdb8e6" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#2e54ad" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2e54ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-gossamer" gradientUnits="userSpaceOnUse" x1="80" y1="18" x2="80" y2="132">
      <stop offset="0%" stop-color="#e3d3f3"/>
      <stop offset="52%" stop-color="#cf9bb4"/>
      <stop offset="100%" stop-color="#7f9fe0"/>
    </linearGradient>
    <filter id="aw-ghostBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="aw-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="aw-sparkBlur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="1.0"/></filter>
    <path id="aw-rwing" d="M80 90 C96 69 110 56 122 47 C131 40 138 33 141 26 C128 58 104 84 80 90 Z"/>
    <path id="aw-rveins" d="M84 88 C99 70 114 52 132 30 M86 89 C98 75 110 62 124 46" fill="none"/>
    <g id="aw-bow">
      <path d="M80 88 C68 80 59 83 60 90 C61 97 73 94 80 88 Z"/>
      <path d="M80 88 C92 80 101 83 100 90 C99 97 87 94 80 88 Z"/>
      <ellipse cx="80" cy="89" rx="3.1" ry="4.1"/>
    </g>
    <path id="aw-ribbons" d="M78 92 C74 102 71 110 69 118 M82 92 C86 102 89 110 91 118" fill="none"/>
    <path id="aw-spark" d="M122 28 C123 33 124 34 129 35 C124 36 123 37 122 42 C121 37 120 36 115 35 C120 34 121 33 122 28 Z"/>
  </defs>

  <!-- deep cobalt base + central glow, full frame -->
  <rect width="640" height="640" fill="#1a1d29"/>
  <rect width="640" height="640" fill="url(#aw-wash)"/>

  <!-- the Angelic Aura, centred & scaled, strengthened to glow on dark -->
  <g transform="translate(64,86) scale(3.2)">
    <g filter="url(#aw-ghostBlur)" opacity="0.42">
      <use href="#aw-rwing" fill="#cdb8e6"/>
      <use href="#aw-rwing" fill="#cdb8e6" transform="matrix(-1 0 0 1 160 0)"/>
    </g>
    <g>
      <use href="#aw-rwing" fill="url(#aw-gossamer)" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>
      <use href="#aw-rwing" fill="url(#aw-gossamer)" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" transform="matrix(-1 0 0 1 160 0)"/>
      <use href="#aw-rveins" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.4" stroke-linecap="round"/>
      <use href="#aw-rveins" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.4" stroke-linecap="round" transform="matrix(-1 0 0 1 160 0)"/>
    </g>
    <!-- ribbons keep a faint glow; the bow renders sharp (no blur) -->
    <g filter="url(#aw-glow)">
      <use href="#aw-ribbons" stroke="#d49ab4" stroke-opacity="0.85" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <use href="#aw-bow" fill="url(#aw-gossamer)" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.0" stroke-linejoin="round"/>
    <g filter="url(#aw-sparkBlur)"><use href="#aw-spark" fill="#ffffff" fill-opacity="0.95"/></g>
    <use href="#aw-spark" fill="#ffffff" fill-opacity="0.6" transform="translate(122 35) scale(0.4) translate(-122 -35)"/>
    <g fill="#ffffff">
      <circle cx="46" cy="52" r="2.4" fill="#cdb8e6" opacity="0.5"/>
      <circle cx="118" cy="66" r="1.6" fill="#cf9bb4" opacity="0.42"/>
      <circle cx="60" cy="114" r="2.8" opacity="0.5"/>
      <circle cx="109" cy="111" r="1.8" fill="#cdb8e6" opacity="0.55"/>
      <circle cx="95" cy="38" r="1.2" opacity="0.4"/>
    </g>
  </g>
</svg>
