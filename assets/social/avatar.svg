<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Seraphic Styler social avatar — the Angelic Aura, felt not seen">
  <!-- ④ Angelic Aura · Profile picture (light). The approved brand icon
       (assets/angelic-aura.svg) on a Profile-Halo wash, scaled to read as an avatar.
       Gossamer + bow nudged up a touch for small-size legibility; otherwise the loved
       original. Export 640×640 PNG (sRGB). The platform crops a centre circle. -->
  <defs>
    <radialGradient id="aa-wash" cx="50%" cy="46%" r="62%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#e2ebfb" stop-opacity="0.5"/>
      <stop offset="74%" stop-color="#cdb8e6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cdb8e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aa-gossamer" gradientUnits="userSpaceOnUse" x1="80" y1="18" x2="80" y2="132">
      <stop offset="0%" stop-color="#cdb8e6"/>
      <stop offset="52%" stop-color="#f1bcd3"/>
      <stop offset="100%" stop-color="#2e54ad"/>
    </linearGradient>
    <filter id="aa-ghostBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="aa-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="aa-sparkBlur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="1.0"/></filter>
    <path id="aa-rwing" d="M80 90 C96 69 110 56 122 47 C131 40 138 33 141 26 C128 58 104 84 80 90 Z"/>
    <path id="aa-rveins" d="M84 88 C99 70 114 52 132 30 M86 89 C98 75 110 62 124 46" fill="none"/>
    <g id="aa-bow">
      <path d="M80 88 C68 80 59 83 60 90 C61 97 73 94 80 88 Z"/>
      <path d="M80 88 C92 80 101 83 100 90 C99 97 87 94 80 88 Z"/>
      <ellipse cx="80" cy="89" rx="3.1" ry="4.1"/>
    </g>
    <path id="aa-ribbons" d="M78 92 C74 102 71 110 69 118 M82 92 C86 102 89 110 91 118" fill="none"/>
    <path id="aa-spark" d="M122 28 C123 33 124 34 129 35 C124 36 123 37 122 42 C121 37 120 36 115 35 C120 34 121 33 122 28 Z"/>
  </defs>

  <!-- ice base + halo wash, full frame, so the circle crop never shows transparency -->
  <rect width="640" height="640" fill="#eef3fb"/>
  <rect width="640" height="640" fill="url(#aa-wash)"/>

  <!-- the Angelic Aura, centred & scaled into the avatar -->
  <g transform="translate(64,86) scale(3.2)">
    <g filter="url(#aa-ghostBlur)" opacity="0.33">
      <use href="#aa-rwing" fill="#cdb8e6"/>
      <use href="#aa-rwing" fill="#cdb8e6" transform="matrix(-1 0 0 1 160 0)"/>
    </g>
    <g>
      <use href="#aa-rwing" fill="url(#aa-gossamer)" fill-opacity="0.44" stroke="#ffffff" stroke-opacity="0.75" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>
      <use href="#aa-rwing" fill="url(#aa-gossamer)" fill-opacity="0.44" stroke="#ffffff" stroke-opacity="0.75" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" transform="matrix(-1 0 0 1 160 0)"/>
      <use href="#aa-rveins" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.4" stroke-linecap="round"/>
      <use href="#aa-rveins" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.4" stroke-linecap="round" transform="matrix(-1 0 0 1 160 0)"/>
    </g>
    <g filter="url(#aa-glow)">
      <use href="#aa-ribbons" stroke="#e7a6c2" stroke-opacity="0.7" stroke-width="1.2" stroke-linecap="round"/>
      <use href="#aa-bow" fill="url(#aa-gossamer)" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.8" stroke-linejoin="round"/>
    </g>
    <g filter="url(#aa-sparkBlur)"><use href="#aa-spark" fill="#ffffff" fill-opacity="0.85"/></g>
    <use href="#aa-spark" fill="#ffffff" fill-opacity="0.5" transform="translate(122 35) scale(0.4) translate(-122 -35)"/>
    <g fill="#ffffff">
      <circle cx="46" cy="52" r="2.4" fill="#cdb8e6" opacity="0.40"/>
      <circle cx="118" cy="66" r="1.6" fill="#f1bcd3" opacity="0.32"/>
      <circle cx="60" cy="114" r="2.8" opacity="0.38"/>
      <circle cx="109" cy="111" r="1.8" fill="#cdb8e6" opacity="0.45"/>
      <circle cx="95" cy="38" r="1.2" opacity="0.30"/>
    </g>
  </g>
</svg>
