<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Seraphic Styler avatar — side butterfly on an aura wash">
  <!-- Profile picture · side butterfly (primary mark) on a Profile-Halo aura wash.
       Export 640×640 PNG. Centre-circle safe. Recolour the stroke within the palette. -->
  <defs>
    <radialGradient id="ab-halo" cx="50%" cy="45%" r="62%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#e2ebfb" stop-opacity="0.5"/>
      <stop offset="74%" stop-color="#cdb8e6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#cdb8e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab-wing" cx="42%" cy="58%" r="68%">
      <stop offset="0%" stop-color="#2e54ad" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#c9b6e8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2e54ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="#eef3fb"/>
  <rect width="640" height="640" fill="url(#ab-halo)"/>
  <!-- side butterfly, centred ~290px tall -->
  <g transform="translate(320 322) scale(7.6) translate(-25.7 -24)">
    <path d="M22.3,27.0 C18.4,18.0 21.6,8.4 31.6,6.6 C38.2,5.4 41.0,11.4 37.8,18.0 C35.0,24.2 28.6,27.4 23.0,28.6 Z" fill="url(#ab-wing)" stroke="#2e54ad" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22.6,29.4 C26.8,31.2 32.2,33.0 35.0,38.0 C36.6,40.8 36.0,43.8 33.6,43.4 C29.6,42.7 25.0,35.6 22.4,30.4 Z" fill="url(#ab-wing)" stroke="#2e54ad" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke="#2e54ad" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23.4,27.4 C25.4,21.6 28.2,15.6 31.6,10.8" stroke-width="0.4" stroke-opacity="0.55"/>
      <path d="M23.4,30.8 C26.6,33.4 29.8,36.6 32.4,40.6" stroke-width="0.4" stroke-opacity="0.55"/>
      <path d="M22.3,27.0 C21.5,28.8 21.5,30.6 22.6,32.2"/>
      <path d="M22.3,27.0 C19.9,22.2 17.2,18.4 13.4,16.4"/>
      <path d="M22.3,27.0 C20.6,21.8 18.8,17.2 16.0,13.8"/>
    </g>
    <circle cx="13.4" cy="16.4" r="0.95" fill="#2e54ad"/>
    <circle cx="16.0" cy="13.8" r="0.95" fill="#2e54ad"/>
  </g>
  <!-- soft sparkle + motes -->
  <path d="M452 198 l8 19 19 8 -19 8 -8 19 -8 -19 -19 -8 19 -8 z" fill="#c98fc4" fill-opacity="0.8"/>
  <circle cx="180" cy="430" r="9" fill="#c9b6e8" fill-opacity="0.6"/>
  <circle cx="470" cy="430" r="6" fill="#8a93de" fill-opacity="0.5"/>
