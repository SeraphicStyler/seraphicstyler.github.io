<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Seraphic Styler monogram — frosted glass section-mark §">
  <!-- Frosted-glass monogram. Avatar / favicon / nav mark. Ethereal-Lavender aurora
       blooms UNDERNEATH a frosted veil; the S is a clear lens onto the sharper,
       cobalt-rich colour beneath, and hovers on a soft drop shadow. No flat glow. -->
  <defs>
    <path id="mg-tile" d="M36 10 H84 C97 10 110 23 110 36 V84 C110 97 97 110 84 110 H36 C23 110 10 97 10 84 V36 C10 23 23 10 36 10 Z"/>
    <clipPath id="mg-tileClip"><use href="#mg-tile"/></clipPath>

    <!-- Lavender Mist + Aurora tones: lav-mist #c9b6e8 · periwinkle #8a93de · orchid #c98fc4 · mauve #cf9bb4 · cobalt heart #2e54ad -->
    <radialGradient id="mg-cobalt" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#2e54ad" stop-opacity="0.58"/><stop offset="100%" stop-color="#2e54ad" stop-opacity="0"/></radialGradient>
    <radialGradient id="mg-lav" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9b6e8" stop-opacity="0.92"/><stop offset="100%" stop-color="#c9b6e8" stop-opacity="0"/></radialGradient>
    <radialGradient id="mg-orchid" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c98fc4" stop-opacity="0.85"/><stop offset="100%" stop-color="#c98fc4" stop-opacity="0"/></radialGradient>
    <radialGradient id="mg-peri" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a93de" stop-opacity="0.72"/><stop offset="100%" stop-color="#8a93de" stop-opacity="0"/></radialGradient>
    <radialGradient id="mg-mauve" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cf9bb4" stop-opacity="0.7"/><stop offset="100%" stop-color="#cf9bb4" stop-opacity="0"/></radialGradient>

    <filter id="mg-frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="mg-tiledrop" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="mg-sdrop" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.3"/></filter>

    <linearGradient id="mg-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2e54ad" stop-opacity="0.20"/></linearGradient>

    <g id="mg-aurora">
      <rect x="0" y="0" width="120" height="120" fill="#eef3fb"/>
      <circle cx="34" cy="32" r="40" fill="url(#mg-lav)"/>
      <circle cx="92" cy="30" r="34" fill="url(#mg-mauve)"/>
      <circle cx="60" cy="58" r="46" fill="url(#mg-cobalt)"/>
      <circle cx="92" cy="92" r="42" fill="url(#mg-orchid)"/>
      <circle cx="26" cy="92" r="36" fill="url(#mg-peri)"/>
    </g>

    <clipPath id="mg-sClip">
      <text x="60" y="80" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="64" font-weight="600">§</text>
    </clipPath>
  </defs>

  <!-- soft hover shadow under the whole tile -->
  <use href="#mg-tile" transform="translate(0 3)" fill="#2e3a66" fill-opacity="0.18" filter="url(#mg-tiledrop)"/>

  <!-- glass body -->
  <g clip-path="url(#mg-tileClip)">
    <use href="#mg-aurora"/>
    <g filter="url(#mg-frost)"><use href="#mg-aurora"/></g>
    <rect x="0" y="0" width="120" height="120" fill="#ffffff" fill-opacity="0.34"/>
    <ellipse cx="60" cy="16" rx="56" ry="22" fill="#ffffff" fill-opacity="0.22"/>

    <!-- the S: drop shadow, then clear refractive reveal, then glass rim -->
    <text x="60" y="80" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#1c2b52" fill-opacity="0.30" filter="url(#mg-sdrop)" transform="translate(0.6 1.7)">§</text>
    <g clip-path="url(#mg-sClip)">
      <use href="#mg-aurora"/>
      <rect x="0" y="0" width="120" height="120" fill="#2e54ad" fill-opacity="0.30"/>
      <!-- subtle vertical deepening: darker foot, lighter crown — sells the refraction -->
      <rect x="0" y="60" width="120" height="60" fill="#22305c" fill-opacity="0.16"/>
    </g>
    <text x="60" y="80" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="0.7">§</text>
  </g>

  <!-- crisp glass rim on the tile -->
  <use href="#mg-tile" fill="none" stroke="url(#mg-rim)" stroke-width="1.2"/>
</svg>
