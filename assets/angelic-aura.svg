<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Seraphic Styler aura — glowing gossamer angel wings with a bow, felt not seen">
  <!-- Footer / hero easter-egg. Place large (>=120px) behind content at z-index:-1; pairs well
       with a slow fade-in on scroll or a gentle hover reveal. -->
  <defs>
    <!-- userSpaceOnUse + r=66 keeps the halo fully inside the 160 canvas, so it
         fades to nothing before any edge (no square clip), and a gentler peak
         opacity so it isn't harsh on dark. -->
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="80" cy="76" r="66">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="0.38" stop-color="#e7eefc" stop-opacity="0.26"/>
      <stop offset="0.72" stop-color="#cdb8e6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#cdb8e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gossamer" gradientUnits="userSpaceOnUse" x1="80" y1="18" x2="80" y2="132">
      <stop offset="0%" stop-color="#cdb8e6"/>
      <stop offset="52%" stop-color="#f1bcd3"/>
      <stop offset="100%" stop-color="#2e54ad"/>
    </linearGradient>
    <filter id="ghostBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="sparkBlur" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>
    <!-- faint film grain so the halo reads organic, not a flat digital blur -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
    </filter>
    <!-- confines the grain to the glow, fading out with it -->
    <mask id="haloMask"><rect x="0" y="0" width="160" height="160" fill="url(#halo)"/></mask>
    <path id="rwing" d="M80 90 C96 69 110 56 122 47 C131 40 138 33 141 26 C128 58 104 84 80 90 Z"/>
    <path id="rveins" d="M84 88 C99 70 114 52 132 30 M86 89 C98 75 110 62 124 46" fill="none"/>
    <g id="bow">
      <path d="M80 88 C68 80 59 83 60 90 C61 97 73 94 80 88 Z"/>
      <path d="M80 88 C92 80 101 83 100 90 C99 97 87 94 80 88 Z"/>
      <ellipse cx="80" cy="89" rx="3.1" ry="4.1"/>
    </g>
    <path id="ribbons" d="M78 92 C74 102 71 110 69 118 M82 92 C86 102 89 110 91 118" fill="none"/>
    <path id="spark" d="M122 28 C123 33 124 34 129 35 C124 36 123 37 122 42 C121 37 120 36 115 35 C120 34 121 33 122 28 Z"/>
  </defs>

  <!-- outer haze -->
  <rect x="0" y="0" width="160" height="160" fill="url(#halo)"/>
  <!-- organic grain, masked to the glow (very faint) -->
  <g mask="url(#haloMask)" opacity="0.4" style="mix-blend-mode:soft-light">
    <rect x="0" y="0" width="160" height="160" filter="url(#grain)"/>
  </g>

  <!-- blurred ghost underlayer -->
  <g filter="url(#ghostBlur)" opacity="0.33">
    <use href="#rwing" fill="#cdb8e6"/>
    <use href="#rwing" fill="#cdb8e6" transform="matrix(-1 0 0 1 160 0)"/>
  </g>

  <!-- gossamer wings -->
  <g>
    <use href="#rwing" fill="url(#gossamer)" fill-opacity="0.30" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>
    <use href="#rwing" fill="url(#gossamer)" fill-opacity="0.30" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" transform="matrix(-1 0 0 1 160 0)"/>
    <use href="#rveins" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.4" stroke-linecap="round"/>
    <use href="#rveins" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.4" stroke-linecap="round" transform="matrix(-1 0 0 1 160 0)"/>
  </g>

  <!-- soft glowing bow + ribbons (strengthened so the wing+bow reads) -->
  <g filter="url(#glow)">
    <use href="#ribbons" stroke="#e7a6c2" stroke-opacity="0.7" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#bow" fill="url(#gossamer)" fill-opacity="0.42" stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  <!-- crisp opaque core knot — keeps the centre in focus against the soft halo -->
  <ellipse cx="80" cy="89" rx="2.2" ry="3" fill="#ffffff" fill-opacity="0.92"/>

  <!-- blurred glowing sparkle (softened so it isn't harsh on dark) -->
  <g filter="url(#sparkBlur)">
    <use href="#spark" fill="#ffffff" fill-opacity="0.6"/>
  </g>
  <use href="#spark" fill="#ffffff" fill-opacity="0.38" transform="translate(122 35) scale(0.4) translate(-122 -35)"/>

  <!-- floating motes -->
  <g fill="#ffffff">
    <circle cx="46" cy="52" r="2.4" fill="#cdb8e6" opacity="0.40"/>
    <circle cx="118" cy="66" r="1.6" fill="#f1bcd3" opacity="0.32"/>
    <circle cx="60" cy="114" r="2.8" opacity="0.38"/>
    <circle cx="109" cy="111" r="1.8" fill="#cdb8e6" opacity="0.45"/>
    <circle cx="95" cy="38" r="1.2" opacity="0.30"/>
  </g>
</svg>
