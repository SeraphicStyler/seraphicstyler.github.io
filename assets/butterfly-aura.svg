<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seraphic Styler aura butterfly">
  <!-- Design B · Aura butterfly — one shape, layered hues + opacity, soft glow (footer easter-egg) -->
  <defs>
    <linearGradient id="bf-aura" x1="20" y1="24" x2="100" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1bcd3"/>
      <stop offset="0.5" stop-color="#8aa9cf"/>
      <stop offset="1" stop-color="#2e54ad"/>
    </linearGradient>
    <radialGradient id="bf-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#f1bcd3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2e54ad" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <g id="wings">
      <path d="M60,57 C66,43 84,29 99,30 C95,32 88,50 74,54 C69,55 64,57 60,57 Z"/>
      <path d="M60,57 C54,43 36,29 21,30 C25,32 32,50 46,54 C51,55 56,57 60,57 Z"/>
      <path d="M60,60 C66,63 80,76 86,86 C82,82 68,82 60,63 Z"/>
      <path d="M60,60 C54,63 40,76 34,86 C38,82 52,82 60,63 Z"/>
    </g>
  </defs>
  <!-- aura glow behind -->
  <circle cx="60" cy="58" r="48" fill="url(#bf-halo)"/>
  <!-- diffuse hue layer -->
  <use href="#wings" fill="url(#bf-aura)" opacity="0.35" filter="url(#soft)"/>
  <!-- crisp body -->
  <use href="#wings" fill="url(#bf-aura)" opacity="0.92"/>
  <!-- inner light -->
  <use href="#wings" fill="#ffffff" opacity="0.18" transform="translate(60 58) scale(0.62) translate(-60 -58)"/>
  <!-- body -->
  <path d="M60,38 C61.6,40 61.6,47 61.2,56 C60.8,66 60.4,75 60,84 C59.6,75 59.2,66 58.8,56 C58.4,47 58.4,40 60,38 Z" fill="#2e54ad" opacity="0.9"/>
  <!-- antennae -->
  <g stroke="#2e54ad" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M59,40 C54,34 50,30 49,25"/>
    <path d="M61,40 C66,34 70,30 71,25"/>
  </g>
  <!-- sparkles -->
  <path d="M97 22 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 z" fill="#ffffff"/>
  <circle cx="22" cy="40" r="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="93" cy="84" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
