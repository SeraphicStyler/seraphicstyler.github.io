<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seraphic Styler angelic fairy wings emblem with centre bow, pearls and sparkles">
  <!-- Optional draw-on animation: add class="draw" to <svg> and uncomment the <style> below. -->
  <!--
  <style>
    .draw [stroke]{stroke-dasharray:600;stroke-dashoffset:600;animation:ssDraw 2.4s ease forwards}
    @keyframes ssDraw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){.draw [stroke]{animation:none;stroke-dashoffset:0}}
  </style>
  -->
  <defs>
    <linearGradient id="gossamer" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#cdb8e6"/>
      <stop offset="1" stop-color="#f1bcd3"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f6e3ee"/>
      <stop offset="1" stop-color="#e3c6da"/>
    </radialGradient>
  </defs>

  <g transform="translate(0,11)">
    <!-- ===== WINGS (right half, mirrored for left) ===== -->
    <g fill="url(#gossamer)" fill-opacity="0.30" stroke="#d98aa8" stroke-width="0.8"
       stroke-linecap="round" stroke-linejoin="round">
      <g id="wingR">
        <!-- forewing: elongated teardrop, gentle S-curve outer edge -->
        <path d="M80.5,70 C85,50 94,30 110,24 C122,19.5 130,27 125,40 C120,53 100,63 80.5,70 Z"/>
        <!-- hindwing: smaller teardrop -->
        <path d="M80,75.5 C90,78 103,84 110,96 C117,107 109,117 99,111 C90,106 81,91 80,80.5 Z"/>
        <!-- gossamer veins, barely there -->
        <path d="M81,69 C95,58 112,45 122,35" fill="none" stroke="#d98aa8" stroke-width="0.4" stroke-opacity="0.55"/>
        <path d="M81,79 C92,88 102,98 108,104" fill="none" stroke="#d98aa8" stroke-width="0.4" stroke-opacity="0.55"/>
      </g>
      <use href="#wingR" transform="translate(160,0) scale(-1,1)"/>
    </g>

    <!-- ===== SPARKLE PAIR (above) ===== -->
    <g stroke="#d98aa8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80,8 C81,14 82,15 88,16 C82,17 81,18 80,24 C79,18 78,17 72,16 C78,15 79,14 80,8 Z"
            fill="#f1bcd3" fill-opacity="0.85" stroke-width="0.6"/>
      <path d="M93.5,19.5 C94.2,22.8 94.7,23.3 98,24 C94.7,24.7 94.2,25.2 93.5,28.5 C92.8,25.2 92.3,24.7 89,24 C92.3,23.3 92.8,22.8 93.5,19.5 Z"
            fill="none" stroke-width="0.7"/>
    </g>

    <!-- ===== PEARL ORBS (stacked, between sparkle and bow) ===== -->
    <g stroke="#d98aa8" stroke-width="0.4" stroke-opacity="0.6">
      <circle cx="80" cy="39" r="3" fill="url(#pearl)"/>
      <circle cx="80" cy="50" r="2.6" fill="url(#pearl)"/>
    </g>
    <!-- specular highlight dots so the pearls read -->
    <circle cx="78.8" cy="37.6" r="0.8" fill="#ffffff"/>
    <circle cx="78.9" cy="48.7" r="0.7" fill="#ffffff"/>

    <!-- ===== CENTRE BOW + RIBBON TAILS ===== -->
    <g stroke="#d98aa8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78.6,69.5 C76.5,86 75,102 73,116" fill="none"/>
      <path d="M81.4,69.5 C83.5,86 85,102 87,116" fill="none"/>
      <path d="M80,66.5 C71,60.5 64,63 65,69 C66,74.3 74,73 80,67.5 Z"
            fill="url(#gossamer)" fill-opacity="0.45"/>
      <path d="M80,66.5 C89,60.5 96,63 95,69 C94,74.3 86,73 80,67.5 Z"
            fill="url(#gossamer)" fill-opacity="0.45"/>
      <ellipse cx="80" cy="67.5" rx="2" ry="3" fill="#f1bcd3" fill-opacity="0.9"/>
    </g>
  </g>
</svg>
