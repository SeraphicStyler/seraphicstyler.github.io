<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="quatrefoil"><defs><linearGradient id="g" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0.000" stop-color="#cdb8e6"/><stop offset="1.000" stop-color="#cf9bb4"/></linearGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="m"/><feComponentTransfer in="m" result="g"><feFuncA type="table" tableValues="0 0.7"/></feComponentTransfer><feComposite in="g" in2="SourceAlpha" operator="in"/></filter><g id="sh"><ellipse cx="50" cy="32" rx="18" ry="18" fill-opacity="0.6" transform="rotate(0.0 50 50)"/><ellipse cx="50" cy="32" rx="18" ry="18" fill-opacity="0.6" transform="rotate(90.0 50 50)"/><ellipse cx="50" cy="32" rx="18" ry="18" fill-opacity="0.6" transform="rotate(180.0 50 50)"/><ellipse cx="50" cy="32" rx="18" ry="18" fill-opacity="0.6" transform="rotate(270.0 50 50)"/></g></defs><use href="#sh" fill="url(#g)"/><use href="#sh" filter="url(#grain)" opacity="0.1" style="mix-blend-mode:multiply"/></svg>
