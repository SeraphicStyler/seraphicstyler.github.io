<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Seraphic Styler mark">
  <!-- Crisp favicon: disc + S only. No halo, no blur, no motes — a sharp
       silhouette that stays legible at 16-32px in a browser tab. -->
  <defs>
    <linearGradient id="fav-disc" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2bfd6"/>
      <stop offset="0.52" stop-color="#8e8dad"/>
      <stop offset="1" stop-color="#446a8c"/>
    </linearGradient>
    <radialGradient id="fav-sheen" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fae2e2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#eccedc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="54" fill="url(#fav-disc)"/>
  <circle cx="60" cy="60" r="54" fill="url(#fav-sheen)"/>
  <circle cx="60" cy="60" r="48.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.2"/>
  <text x="60" y="81" text-anchor="middle" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#ffffff">S</text>
</svg>
