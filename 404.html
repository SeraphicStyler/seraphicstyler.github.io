<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Seraphic Styler</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1d29" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400&family=Montserrat:wght@400;500&family=Pinyon+Script&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
  /* Brand V2 "Ethereal Lavender" tokens — mirrors css/styles.css */
  :root{
    --bg:#eef3fb; --ink:#233a72; --accent:#2e54ad; --accent-hover:#234193;
    --muted:#51618f; --lav:#c9b6e8; --peri:#8a93de; --cta-text:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1d29; --ink:#e8ebf5; --accent:#a9b8ee; --accent-hover:#c2cdf5;
      --muted:#9aa5c4; --cta-text:#1a1d29; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif}
  /* a quiet aurora wash, CSS only */
  .aura{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(46% 38% at 26% 18%, rgba(201,182,232,.42), transparent 70%),
      radial-gradient(40% 34% at 78% 26%, rgba(138,147,222,.28), transparent 70%),
      radial-gradient(52% 42% at 55% 88%, rgba(207,155,180,.20), transparent 70%);}
  @media (prefers-color-scheme: dark){
    .aura{background:
      radial-gradient(46% 38% at 26% 18%, rgba(201,182,232,.14), transparent 70%),
      radial-gradient(40% 34% at 78% 26%, rgba(138,147,222,.12), transparent 70%),
      radial-gradient(52% 42% at 55% 88%, rgba(207,155,180,.08), transparent 70%);}
  }
  .panel{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px 22px;gap:.4rem}
  .mark{width:44px;height:44px;color:var(--accent);margin-bottom:.6rem}
  .lock{display:flex;flex-direction:column;align-items:center;line-height:.9;margin-bottom:1.5rem}
  .lock .s{font-family:'Tenor Sans',serif;text-transform:uppercase;letter-spacing:.34em;font-size:.92rem;color:var(--ink)}
  .lock .y{font-family:'Pinyon Script',cursive;font-size:1.6rem;color:var(--peri);margin-top:.12em}
  .code{font-family:'Merriweather Sans',sans-serif;font-weight:300;font-size:clamp(4.5rem,20vw,9.5rem);
    line-height:.95;margin:0;letter-spacing:.03em;color:var(--accent)}
  .head{font-family:'Merriweather Sans',sans-serif;font-weight:400;font-size:clamp(1.3rem,4vw,1.9rem);margin:.25rem 0 .1rem}
  .sub{color:var(--muted);font-size:.95rem;line-height:1.6;max-width:46ch;margin:.2rem 0 1.6rem}
  .btn{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;min-height:44px;
    font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cta-text);background:var(--accent);
    padding:.85rem 2rem;border-radius:999px;transition:transform .3s cubic-bezier(.25,1,.5,1),background .3s ease}
  .btn:hover{transform:translateY(-2px);background:var(--accent-hover)}
  .links{display:flex;flex-wrap:wrap;gap:.2rem 1.4rem;justify-content:center;margin-top:1.6rem;font-size:.82rem}
  .links a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;padding:6px 0 2px;transition:border-color .25s}
  .links a:hover{border-color:currentColor}
  a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>

  <main class="panel">
    <svg class="mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22.3,27.0 C18.4,18.0 21.6,8.4 31.6,6.6 C38.2,5.4 41.0,11.4 37.8,18.0 C35.0,24.2 28.6,27.4 23.0,28.6 Z"/><path d="M22.6,29.4 C26.8,31.2 32.2,33.0 35.0,38.0 C36.6,40.8 36.0,43.8 33.6,43.4 C29.6,42.7 25.0,35.6 22.4,30.4 Z"/><path d="M22.3,27.0 C21.5,28.8 21.5,30.6 22.6,32.2"/><path d="M22.3,27.0 C19.9,22.2 17.2,18.4 13.4,16.4"/><path d="M22.3,27.0 C20.6,21.8 18.8,17.2 16.0,13.8"/><circle cx="13.4" cy="16.4" r="1.2" fill="currentColor" stroke="none"/><circle cx="16.0" cy="13.8" r="1.2" fill="currentColor" stroke="none"/></svg>
    <span class="lock"><span class="s">Seraphic</span><span class="y">Styler</span></span>
    <p class="code">404</p>
    <h1 class="head">This thread slipped the loom</h1>
    <p class="sub">The page you're after has moved or the link is broken. Let's get you back to something beautiful.</p>
    <a class="btn" href="./">↩ Return to Seraphic Styler</a>
    <nav class="links" aria-label="Popular pages">
      <a href="./#services">Services</a>
      <a href="lookbook">Lookbook</a>
      <a href="estimate">Estimate</a>
      <a href="fashion-directory">Directory</a>
      <a href="links">Link hub</a>
    </nav>
  </main>
</body>
</html>
