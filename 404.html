<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Seraphic Styler</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tenor+Sans&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#070a10;color:#e7eefb;font-family:'Montserrat',system-ui,sans-serif;overflow:hidden}
  /* FaultyTerminal background fills the viewport */
  .faulty-terminal-container{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;z-index:0}
  /* legibility scrim over the busy terminal */
  .scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(60% 60% at 50% 46%,rgba(7,10,16,.72),rgba(7,10,16,.30) 60%,transparent 100%)}
  /* centered content */
  .panel{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px 22px;gap:.4rem}
  .lock{display:flex;flex-direction:column;align-items:center;line-height:.9;margin-bottom:1.6rem}
  .lock .s{font-family:'Tenor Sans',serif;text-transform:uppercase;letter-spacing:.34em;font-size:.92rem;
    color:#dce8fb;text-shadow:0 0 18px rgba(134,172,235,.5)}
  .lock .y{font-family:'Cormorant Garamond',cursive;font-style:italic;font-size:1.5rem;color:#9fb8ee;margin-top:.1em}
  .code{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(5rem,22vw,11rem);
    line-height:.95;margin:0;letter-spacing:.04em;color:#eef4ff;text-shadow:0 0 30px rgba(134,172,235,.55),0 0 70px rgba(46,84,173,.4)}
  .head{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(1.4rem,4vw,2.1rem);margin:.2rem 0 .1rem;color:#eaf1ff}
  .sub{color:#aebbd6;font-size:.95rem;line-height:1.6;max-width:46ch;margin:.2rem 0 1.7rem}
  .btn{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;
    font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#0a0f18;background:#bcd2f5;
    padding:.95rem 2rem;border-radius:999px;transition:transform .35s cubic-bezier(.25,1,.5,1),background .35s ease}
  .btn:hover{transform:translateY(-2px);background:#d8e6ff}
  .links{display:flex;flex-wrap:wrap;gap:.2rem 1.4rem;justify-content:center;margin-top:1.7rem;font-size:.8rem}
  .links a{color:#9fb8ee;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .25s,color .25s}
  .links a:hover{color:#e7eefb;border-color:rgba(159,184,238,.7)}
  @media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</head>
<body>
  <!-- terminal background -->
  <div class="faulty-terminal-container" id="terminal" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <main class="panel">
    <span class="lock"><span class="s">Seraphic</span><span class="y">Styler</span></span>
    <p class="code">404</p>
    <h1 class="head">This thread slipped the loom</h1>
    <p class="sub">The page you're after has moved or the link is broken. Let's get you back to something
      beautiful.</p>
    <a class="btn" href="./">↩ Return to Seraphic Styler</a>
    <nav class="links">
      <a href="./#services">Services</a>
      <a href="./#lookbook">Lookbook</a>
      <a href="./#estimate">Estimate</a>
      <a href="./#contact">Contact</a>
      <a href="links">Link hub</a>
    </nav>
  </main>

  <!-- ogl (UMD global) must load before js/faulty-terminal.js -->
  <script src="js/vendor/ogl.umd.js"></script>
  <script src="js/faulty-terminal.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (!window.initFaultyTerminal) return;
      window.initFaultyTerminal(document.getElementById('terminal'), {
        scale: 2.3,
        gridMul: [2, 1],
        digitSize: 1.7,
        timeScale: 1.6,
        pause: false,
        scanlineIntensity: 1.1,
        glitchAmount: 1,
        flickerAmount: 1,
        noiseAmp: 0.9,
        chromaticAberration: 0,
        dither: 0,
        curvature: 0.1,
        tint: "#86aceb",
        mouseReact: true,
        mouseStrength: 1,
        pageLoadAnimation: true,
        brightness: 0.7
      });
    });
  </script>
</body>
</html>
